[Config Priority_rho05]
network = my_PQ
description = "Priority Queue at 50% Load"
# Total arrival rate = 0.5. Let's split it 20% High Priority, 80% Low Priority
**.source.interArrivalTime = exponential(10.0s)  # High Priority (? = 0.1)
**.source1.interArrivalTime = exponential(2.5s)  # Low Priority (? = 0.4)
**.server.serviceTime = exponential(1.0s)
**.source.numJobs = 200000
**.source1.numJobs = 800000

