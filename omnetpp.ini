# --- M/M/2 Configurations ---

[Config MMC_c2_rho05]
network = Queueing_network
description = "M/M/2 Multi-server at 50% load"
# Total λ = 1.0, μ = 1.0 per server. ρ = 1.0 / (2 * 1.0) = 0.5
**.gen.interArrivalTime = exponential(1.0s) 
**.fifo.serviceTime = exponential(1.0s)
**.fifo.numServers = 2
**.gen.numJobs = 1000000

